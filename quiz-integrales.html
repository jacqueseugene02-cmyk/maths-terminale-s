<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz - Intégrales</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>🧠 Quiz — Intégrales</h1>

    <p>Terminale S • Niveau avancé</p>

    <a href="cours.html">📚 Retour aux cours</a>

</header>


<main>

<section class="quiz-box">

    <h2 id="titre">Question 1 / 10</h2>

    <div id="quiz"></div>

    <button id="suivant" onclick="suivante()">
        Question suivante →
    </button>

    <div id="resultat"></div>

</section>

</main>


<footer>

    <p>© 2026 Maths Terminale S</p>

</footer>


<script>

const questions = [

{
    question: "Une primitive de f(x) = 3x² est :",

    reponses: [
        "x³",
        "3x³",
        "x²",
        "6x"
    ],

    correcte: 0
},

{
    question: "Une primitive de f(x) = cos(x) est :",

    reponses: [
        "-sin(x)",
        "sin(x)",
        "cos(x)",
        "-cos(x)"
    ],

    correcte: 1
},

{
    question: "Une primitive de f(x) = sin(x) est :",

    reponses: [
        "cos(x)",
        "-cos(x)",
        "sin(x)",
        "-sin(x)"
    ],

    correcte: 1
},

{
    question: "∫ 1/x dx sur ]0 ; +∞[ vaut :",

    reponses: [
        "x",
        "1/x",
        "ln(x)",
        "eˣ"
    ],

    correcte: 2
},

{
    question: "∫ 2x dx entre 0 et 3 vaut :",

    reponses: [
        "3",
        "6",
        "9",
        "18"
    ],

    correcte: 2
},

{
    question: "Si F est une primitive de f, alors ∫ₐᵇ f(x)dx vaut :",

    reponses: [
        "F(a) + F(b)",
        "F(b) - F(a)",
        "F(a) - F(b)",
        "F(a)F(b)"
    ],

    correcte: 1
},

{
    question: "∫₀¹ x² dx vaut :",

    reponses: [
        "1/2",
        "1/3",
        "2/3",
        "1"
    ],

    correcte: 1
},

{
    question: "Une primitive de eˣ est :",

    reponses: [
        "eˣ",
        "xeˣ",
        "ln(x)",
        "eˣ/x"
    ],

    correcte: 0
},

{
    question: "∫₀π sin(x) dx vaut :",

    reponses: [
        "0",
        "1",
        "2",
        "π"
    ],

    correcte: 2
},

{
    question: "Si f(x) ≥ 0 sur [a ; b], alors ∫ₐᵇ f(x)dx est :",

    reponses: [
        "toujours négative",
        "toujours nulle",
        "positive ou nulle",
        "toujours égale à 1"
    ],

    correcte: 2
}

];


questions.sort(() => Math.random() - 0.5);

let numero = 0;
let score = 0;
let repondu = false;


function afficher() {

    repondu = false;

    const q = questions[numero];

    document.getElementById("titre").textContent =
        "Question " + (numero + 1) +
        " / " + questions.length;

    let contenu =
        "<h3>" + q.question + "</h3>";

    for (let i = 0; i < q.reponses.length; i++) {

        contenu +=
        '<button class="reponse" onclick="verifier(' +
        i + ')">' +
        q.reponses[i] +
        '</button>';

    }

    document.getElementById("quiz").innerHTML =
        contenu;

    document.getElementById("resultat").innerHTML =
        "";

}


function verifier(index) {

    if (repondu) return;

    repondu = true;

    const q = questions[numero];

    const boutons =
        document.querySelectorAll(".reponse");

    if (index === q.correcte) {

        score++;

        boutons[index].classList.add("bonne");

        document.getElementById("resultat").innerHTML =
            "✅ Bonne réponse !";

    } else {

        boutons[index].classList.add("mauvaise");

        boutons[q.correcte].classList.add("bonne");

        document.getElementById("resultat").innerHTML =
            "❌ Mauvaise réponse.";

    }

}


function suivante() {

    if (!repondu) {

        alert("Choisis une réponse avant de continuer.");

        return;

    }

    numero++;

    if (numero < questions.length) {

        afficher();

    } else {

        finQuiz();

    }

}


function finQuiz() {

    document.getElementById("quiz").innerHTML =
        "";

    document.getElementById("titre").textContent =
        "🎉 Quiz terminé";

    document.getElementById("suivant").style.display =
        "none";

    let message;

    if (score >= 9) {

        message = "🏆 Excellent ! Tu maîtrises très bien les intégrales.";

    } else if (score >= 7) {

        message = "👏 Très bon niveau !";

    } else if (score >= 5) {

        message = "👍 Pas mal. Continue à t'entraîner.";

    } else {

        message = "📚 Reprends le cours puis réessaie.";

    }

    document.getElementById("resultat").innerHTML =

        "<h2>Score : " +
        score + " / " +
        questions.length +
        "</h2>" +

        "<p>" + message + "</p>" +

        '<button onclick="location.reload()">' +
        "🔄 Recommencer" +
        "</button>";

}


afficher();

</script>

</body>

</html>
