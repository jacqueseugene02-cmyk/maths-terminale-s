<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Nombres complexes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>🧠 Quiz — Nombres complexes</h1>

    <p>Terminale S • Niveau avancé</p>

    <a href="cours.html">📚 Retour aux cours</a>

</header>


<main>

<section class="quiz-box">

    <h2 id="titre">Question 1 / 10</h2>

    <div id="quiz"></div>

    <button id="suivant" onclick="suivante()">
        Question suivante →
    </button>

    <div id="resultat"></div>

</section>

</main>


<footer>

    <p>© 2026 Maths Terminale S</p>

</footer>


<script>

const questions = [

{
    question: "Soit z = 3 + 4i. Quel est son module ?",

    reponses: [
        "3",
        "4",
        "5",
        "7"
    ],

    correcte: 2
},

{
    question: "Soit z = 1 + i. Quel est le module de z ?",

    reponses: [
        "1",
        "√2",
        "2",
        "0"
    ],

    correcte: 1
},

{
    question: "Le conjugué de z = 5 - 2i est :",

    reponses: [
        "5 + 2i",
        "-5 + 2i",
        "5 - 2i",
        "-5 - 2i"
    ],

    correcte: 0
},

{
    question: "Si z = a + bi, alors Re(z) vaut :",

    reponses: [
        "b",
        "a",
        "a + b",
        "ab"
    ],

    correcte: 1
},

{
    question: "Résoudre z² = -1 dans ℂ. Les solutions sont :",

    reponses: [
        "1 et -1",
        "i et -i",
        "0 et 1",
        "2 et -2"
    ],

    correcte: 1
},

{
    question: "Si z = 2(cos θ + i sin θ), son module est :",

    reponses: [
        "θ",
        "1",
        "2",
        "cos θ"
    ],

    correcte: 2
},

{
    question: "Quelle relation est toujours vraie pour un nombre complexe z ?",

    reponses: [
        "z + z̄ = 2Re(z)",
        "z + z̄ = 2Im(z)",
        "z z̄ = z",
        "z̄ = z + 1"
    ],

    correcte: 0
},

{
    question: "Si |z| = 3, alors |z²| vaut :",

    reponses: [
        "3",
        "6",
        "9",
        "12"
    ],

    correcte: 2
},

{
    question: "Le produit d'un complexe par son conjugué est égal à :",

    reponses: [
        "son argument",
        "le carré de son module",
        "son opposé",
        "son inverse"
    ],

    correcte: 1
},

{
    question: "Si z = 1 + i, alors z² vaut :",

    reponses: [
        "2",
        "2i",
        "1 + 2i",
        "-2i"
    ],

    correcte: 3
}

];


questions.sort(() => Math.random() - 0.5);

let numero = 0;
let score = 0;
let repondu = false;


function afficher() {

    repondu = false;

    const q = questions[numero];

    document.getElementById("titre").textContent =
        "Question " + (numero + 1) +
        " / " + questions.length;

    let contenu =
        "<h3>" + q.question + "</h3>";

    for (let i = 0; i < q.reponses.length; i++) {

        contenu +=
        '<button class="reponse" onclick="verifier(' +
        i + ')">' +
        q.reponses[i] +
        '</button>';

    }

    document.getElementById("quiz").innerHTML =
        contenu;

    document.getElementById("resultat").innerHTML =
        "";

}


function verifier(index) {

    if (repondu) return;

    repondu = true;

    const q = questions[numero];

    const boutons =
        document.querySelectorAll(".reponse");

    if (index === q.correcte) {

        score++;

        boutons[index].classList.add("bonne");

        document.getElementById("resultat").innerHTML =
            "✅ Bonne réponse !";

    } else {

        boutons[index].classList.add("mauvaise");

        boutons[q.correcte].classList.add("bonne");

        document.getElementById("resultat").innerHTML =
            "❌ Mauvaise réponse.";

    }

}


function suivante() {

    if (!repondu) {

        alert("Choisis une réponse avant de continuer.");

        return;

    }

    numero++;

    if (numero < questions.length) {

        afficher();

    } else {

        finQuiz();

    }

}


function finQuiz() {

    document.getElementById("quiz").innerHTML =
        "";

    document.getElementById("titre").textContent =
        "🎉 Quiz terminé";

    document.getElementById("suivant").style.display =
        "none";

    let message;

    if (score >= 9) {

        message =
            "🏆 Excellent !";

    } else if (score >= 7) {

        message =
            "👏 Très bon niveau !";

    } else if (score >= 5) {

        message =
            "👍 Niveau moyen. Continue à t'entraîner.";

    } else {

        message =
            "📚 Reprends le cours et réessaie.";

    }

    document.getElementById("resultat").innerHTML =

        "<h2>Score : " +
        score + " / " +
        questions.length +
        "</h2>" +

        "<p>" + message + "</p>" +

        '<button onclick="location.reload()">' +
        "🔄 Recommencer" +
        "</button>";

}


afficher();

</script>

</body>

</html>
