<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Terminale S</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>🧠 Quiz Terminale S</h1>

    <p>Teste réellement ton niveau en mathématiques</p>

    <a href="index.html">🏠 Accueil</a>

</header>


<main>

<section class="quiz-box">

    <h2>Quiz niveau avancé</h2>

    <p id="progression">
        Question 1 / 10
    </p>

    <div id="quiz"></div>

    <button id="suivant" onclick="questionSuivante()">
        Question suivante →
    </button>

    <div id="resultat"></div>

</section>

</main>


<footer>

    <p>© 2026 Maths Terminale S</p>

</footer>


<script>

const questions = [

{
    question: "Soit f(x) = x²eˣ. Quelle est f'(x) ?",

    reponses: [
        "2xeˣ",
        "eˣ(x² + 2x)",
        "x²eˣ + 2",
        "eˣ(x + 2)"
    ],

    correcte: 1
},


{
    question: "Quelle est une primitive de 1/x sur ]0 ; +∞[ ?",

    reponses: [
        "x",
        "1/x²",
        "ln(x)",
        "eˣ"
    ],

    correcte: 2
},


{
    question: "Si z = 3 - 4i, quel est |z| ?",

    reponses: [
        "1",
        "5",
        "7",
        "25"
    ],

    correcte: 1
},


{
    question: "Si X suit B(10 ; 0,2), quelle est E(X) ?",

    reponses: [
        "0,2",
        "2",
        "5",
        "10"
    ],

    correcte: 1
},


{
    question: "Le produit scalaire de (1 ; 2 ; 3) et (2 ; 0 ; -1) vaut :",

    reponses: [
        "-1",
        "0",
        "2",
        "5"
    ],

    correcte: 2
},


{
    question: "La dérivée de ln(x) sur ]0 ; +∞[ est :",

    reponses: [
        "ln(x)",
        "x",
        "1/x",
        "eˣ"
    ],

    correcte: 2
},


{
    question: "Si P(A)=0,4 et P(B)=0,5 et A,B sont indépendants, alors P(A∩B) vaut :",

    reponses: [
        "0,1",
        "0,2",
        "0,4",
        "0,9"
    ],

    correcte: 1
},


{
    question: "Quel est le module de z = 1 + √3 i ?",

    reponses: [
        "1",
        "√3",
        "2",
        "4"
    ],

    correcte: 2
},


{
    question: "Une équation d'un plan de l'espace peut s'écrire :",

    reponses: [
        "ax + by + cz + d = 0",
        "ax + b = 0",
        "y = ax + b",
        "x² + y² = 1"
    ],

    correcte: 0
},


{
    question: "Si u⃗·v⃗ = 0, alors les deux vecteurs sont :",

    reponses: [
        "colinéaires",
        "égaux",
        "orthogonaux",
        "opposés"
    ],

    correcte: 2
}

];


let numero = 0;
let score = 0;
let repondu = false;


function afficherQuestion() {

    repondu = false;

    const q = questions[numero];

    document.getElementById("progression").textContent =
        "Question " + (numero + 1) + " / " + questions.length;

    let html = "<h3>" + q.question + "</h3>";

    for (let i = 0; i < q.reponses.length; i++) {

        html += `
        <button class="reponse"
                onclick="verifier(${i})">
            ${q.reponses[i]}
        </button>
        `;

    }

    document.getElementById("quiz").innerHTML = html;

    document.getElementById("resultat").innerHTML = "";

}


function verifier(index) {

    if (repondu) return;

    repondu = true;

    const q = questions[numero];

    const boutons =
        document.querySelectorAll(".reponse");

    if (index === q.correcte) {

        score++;

        boutons[index].classList.add("bonne");

        document.getElementById("resultat").innerHTML =
            "✅ Bonne réponse !";

    } else {

        boutons[index].classList.add("mauvaise");

        boutons[q.correcte].classList.add("bonne");

        document.getElementById("resultat").innerHTML =
            "❌ Mauvaise réponse.";

    }

}


function questionSuivante() {

    if (!repondu) {

        alert("Choisis d'abord une réponse.");

        return;

    }

    numero++;

    if (numero < questions.length) {

        afficherQuestion();

    } else {

        afficherResultat();

    }

}


function afficherResultat() {

    document.getElementById("quiz").innerHTML = "";

    document.getElementById("progression").innerHTML =
        "🎉 Quiz terminé !";

    document.getElementById("suivant").style.display =
        "none";

    let message = "";

    if (score >= 9) {

        message =
            "🏆 Excellent ! Tu maîtrises très bien le programme.";

    } else if (score >= 7) {

        message =
            "👏 Très bon niveau ! Continue tes efforts.";

    } else if (score >= 5) {

        message =
            "👍 Niveau moyen. Il faut encore t'entraîner.";

    } else {

        message =
            "📚 Reprends les cours et réessaie le quiz.";

    }

    document.getElementById("resultat").innerHTML =

        "<h2>Score : " +
        score +
        " / " +
        questions.length +
        "</h2>" +

        "<p>" +
        message +
        "</p>" +

        '<button onclick="location.reload()">' +
        "🔄 Recommencer" +
        "</button>";

}


afficherQuestion();

</script>

</body>

</html>
