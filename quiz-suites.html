<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz - Suites numériques</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>🧠 Quiz — Suites numériques</h1>

    <p>Terminale S • Niveau avancé</p>

    <nav>
        <a href="index.html">🏠 Accueil</a>
        <a href="cours.html">📚 Cours</a>
        <a href="quiz.html">🧠 Tous les quiz</a>
    </nav>

</header>


<main>

<section class="quiz-box">

    <h2 id="titre">Question 1 / 10</h2>

    <div id="quiz"></div>

    <button id="suivant" onclick="suivante()">
        Question suivante →
    </button>

    <div id="resultat"></div>

</section>

</main>


<footer>

    <p>© 2026 Maths Terminale S</p>

    <p>Apprendre les maths autrement 🚀</p>

</footer>


<script>

const questions = [

{
    question: "Une suite arithmétique de premier terme u₀ = 3 et de raison 5 vérifie :",

    reponses: [
        "uₙ = 3 + 5n",
        "uₙ = 3 × 5ⁿ",
        "uₙ = 5 + 3n",
        "uₙ = 3n⁵"
    ],

    correcte: 0
},

{
    question: "Une suite géométrique de premier terme u₀ = 2 et de raison 3 vérifie :",

    reponses: [
        "uₙ = 2 + 3n",
        "uₙ = 2 × 3ⁿ",
        "uₙ = 3 × 2ⁿ",
        "uₙ = 6n"
    ],

    correcte: 1
},

{
    question: "Soit uₙ = 2n + 1. Quelle est la raison de cette suite ?",

    reponses: [
        "1",
        "2",
        "3",
        "n"
    ],

    correcte: 1
},

{
    question: "Soit uₙ = 3 × 2ⁿ. Quelle est sa raison ?",

    reponses: [
        "2",
        "3",
        "5",
        "n"
    ],

    correcte: 0
},

{
    question: "Si une suite arithmétique a pour raison r = -2, alors elle est :",

    reponses: [
        "strictement croissante",
        "strictement décroissante",
        "constante",
        "toujours positive"
    ],

    correcte: 1
},

{
    question: "La suite géométrique de raison q = 1 est :",

    reponses: [
        "strictement croissante",
        "strictement décroissante",
        "constante",
        "toujours négative"
    ],

    correcte: 2
},

{
    question: "La formule correcte de la somme 1 + 2 + 3 + ... + n est :",

    reponses: [
        "n(n+1)/2",
        "n²",
        "n(n-1)/2",
        "2n"
    ],

    correcte: 0
},

{
    question: "Pour une suite géométrique de premier terme u₀ et de raison q ≠ 1, la somme u₀ + u₁ + ... + uₙ vaut :",

    reponses: [
        "u₀ × (1-qⁿ)/(1-q)",
        "u₀ × (1-qⁿ⁺¹)/(1-q)",
        "u₀ + qⁿ",
        "n × u₀"
    ],

    correcte: 1
},

{
    question: "Si uₙ = 5(0,5)ⁿ, alors la limite de uₙ lorsque n tend vers +∞ est :",

    reponses: [
        "5",
        "1",
        "0",
        "+∞"
    ],

    correcte: 2
},

{
    question: "Une suite croissante et majorée est nécessairement :",

    reponses: [
        "divergente",
        "convergente",
        "constante",
        "négative"
    ],

    correcte: 1
}

];


questions.sort(() => Math.random() - 0.5);

let numero = 0;
let score = 0;
let repondu = false;


function afficher() {

    repondu = false;

    const q = questions[numero];

    document.getElementById("titre").textContent =
        "Question " + (numero + 1) +
        " / " + questions.length;

    let contenu =
        "<h3>" + q.question + "</h3>";

    for (let i = 0; i < q.reponses.length; i++) {

        contenu +=
        '<button class="reponse" onclick="verifier(' +
        i + ')">' +
        q.reponses[i] +
        '</button>';

    }

    document.getElementById("quiz").innerHTML =
        contenu;

    document.getElementById("resultat").innerHTML =
        "";

}


function verifier(index) {

    if (repondu) return;

    repondu = true;

    const q = questions[numero];

    const boutons =
        document.querySelectorAll(".reponse");

    if (index === q.correcte) {

        score++;

        boutons[index].classList.add("bonne");

        document.getElementById("resultat").innerHTML =
            "✅ Bonne réponse !";

    } else {

        boutons[index].classList.add("mauvaise");

        boutons[q.correcte].classList.add("bonne");

        document.getElementById("resultat").innerHTML =
            "❌ Mauvaise réponse.";

    }

}


function suivante() {

    if (!repondu) {

        alert("Choisis une réponse avant de continuer.");

        return;

    }

    numero++;

    if (numero < questions.length) {

        afficher();

    } else {

        finQuiz();

    }

}


function finQuiz() {

    document.getElementById("quiz").innerHTML =
        "";

    document.getElementById("titre").textContent =
        "🎉 Quiz terminé";

    document.getElementById("suivant").style.display =
        "none";

    let message;

    if (score >= 9) {

        message =
            "🏆 Excellent ! Tu maîtrises très bien les suites.";

    } else if (score >= 7) {

        message =
            "👏 Très bon niveau !";

    } else if (score >= 5) {

        message =
            "👍 Bon début. Continue à t'entraîner.";

    } else {

        message =
            "📚 Reprends le cours et réessaie.";

    }

    document.getElementById("resultat").innerHTML =

        "<h2>Score : " +
        score + " / " +
        questions.length +
        "</h2>" +

        "<p>" + message + "</p>" +

        '<button onclick="location.reload()">' +
        "🔄 Recommencer" +
        "</button>";

}


afficher();

</script>

</body>

</html>
