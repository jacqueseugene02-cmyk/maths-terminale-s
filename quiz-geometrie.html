<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz - Géométrie dans l'espace</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>🧠 Quiz — Géométrie dans l'espace</h1>

    <p>Terminale S • Niveau avancé</p>

    <a href="cours.html">📚 Retour aux cours</a>

</header>


<main>

<section class="quiz-box">

    <h2 id="titre">Question 1 / 10</h2>

    <div id="quiz"></div>

    <button id="suivant" onclick="suivante()">
        Question suivante →
    </button>

    <div id="resultat"></div>

</section>

</main>


<footer>

    <p>© 2026 Maths Terminale S</p>

</footer>


<script>

const questions = [

{
    question: "Dans l'espace, combien de coordonnées faut-il pour repérer un point ?",

    reponses: [
        "1",
        "2",
        "3",
        "4"
    ],

    correcte: 2
},

{
    question: "Soient A(1 ; 2 ; 3) et B(4 ; 5 ; 7). Les coordonnées de AB⃗ sont :",

    reponses: [
        "(3 ; 3 ; 4)",
        "(5 ; 7 ; 10)",
        "(-3 ; -3 ; -4)",
        "(4 ; 5 ; 7)"
    ],

    correcte: 0
},

{
    question: "La norme du vecteur u⃗ = (3 ; 4 ; 0) est :",

    reponses: [
        "3",
        "4",
        "5",
        "7"
    ],

    correcte: 2
},

{
    question: "Deux vecteurs sont orthogonaux lorsque leur produit scalaire est :",

    reponses: [
        "1",
        "-1",
        "0",
        "égal à leur norme"
    ],

    correcte: 2
},

{
    question: "Le produit scalaire de (1 ; 2 ; 3) et (2 ; 1 ; 0) vaut :",

    reponses: [
        "2",
        "4",
        "5",
        "6"
    ],

    correcte: 2
},

{
    question: "Un vecteur normal au plan 2x + 3y - z + 5 = 0 est :",

    reponses: [
        "(2 ; 3 ; -1)",
        "(2 ; -3 ; 1)",
        "(3 ; 2 ; -1)",
        "(1 ; 3 ; 2)"
    ],

    correcte: 0
},

{
    question: "Une équation cartésienne d'un plan est de la forme :",

    reponses: [
        "ax + by + cz + d = 0",
        "ax + b = 0",
        "y = ax + b",
        "x² + y² = 1"
    ],

    correcte: 0
},

{
    question: "Deux vecteurs directeurs colinéaires définissent deux droites qui peuvent être :",

    reponses: [
        "toujours perpendiculaires",
        "parallèles",
        "toujours confondues",
        "toujours sécantes"
    ],

    correcte: 1
},

{
    question: "La distance entre A(0 ; 0 ; 0) et B(3 ; 4 ; 12) est :",

    reponses: [
        "5",
        "12",
        "13",
        "19"
    ],

    correcte: 2
},

{
    question: "Si un vecteur directeur d'une droite est colinéaire à un vecteur normal d'un plan, alors la droite est :",

    reponses: [
        "parallèle au plan",
        "contenue dans le plan",
        "perpendiculaire au plan",
        "confondue avec le plan"
    ],

    correcte: 2
}

];


questions.sort(() => Math.random() - 0.5);

let numero = 0;
let score = 0;
let repondu = false;


function afficher() {

    repondu = false;

    const q = questions[numero];

    document.getElementById("titre").textContent =
        "Question " + (numero + 1) +
        " / " + questions.length;

    let contenu =
        "<h3>" + q.question + "</h3>";

    for (let i = 0; i < q.reponses.length; i++) {

        contenu +=
        '<button class="reponse" onclick="verifier(' +
        i + ')">' +
        q.reponses[i] +
        '</button>';

    }

    document.getElementById("quiz").innerHTML =
        contenu;

    document.getElementById("resultat").innerHTML =
        "";

}


function verifier(index) {

    if (repondu) return;

    repondu = true;

    const q = questions[numero];

    const boutons =
        document.querySelectorAll(".reponse");

    if (index === q.correcte) {

        score++;

        boutons[index].classList.add("bonne");

        document.getElementById("resultat").innerHTML =
            "✅ Bonne réponse !";

    } else {

        boutons[index].classList.add("mauvaise");

        boutons[q.correcte].classList.add("bonne");

        document.getElementById("resultat").innerHTML =
            "❌ Mauvaise réponse.";

    }

}


function suivante() {

    if (!repondu) {

        alert("Choisis une réponse avant de continuer.");

        return;

    }

    numero++;

    if (numero < questions.length) {

        afficher();

    } else {

        finQuiz();

    }

}


function finQuiz() {

    document.getElementById("quiz").innerHTML =
        "";

    document.getElementById("titre").textContent =
        "🎉 Quiz terminé";

    document.getElementById("suivant").style.display =
        "none";

    let message;

    if (score >= 9) {

        message =
            "🏆 Excellent ! Tu maîtrises très bien la géométrie.";

    } else if (score >= 7) {

        message =
            "👏 Très bon niveau !";

    } else if (score >= 5) {

        message =
            "👍 Niveau moyen. Continue à t'entraîner.";

    } else {

        message =
            "📚 Reprends le cours et réessaie.";

    }

    document.getElementById("resultat").innerHTML =

        "<h2>Score : " +
        score + " / " +
        questions.length +
        "</h2>" +

        "<p>" + message + "</p>" +

        '<button onclick="location.reload()">' +
        "🔄 Recommencer" +
        "</button>";

}


afficher();

</script>

</body>

</html>
