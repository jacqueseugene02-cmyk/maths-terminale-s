<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz - Dérivation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>🧠 Quiz — Dérivation</h1>

    <p>Terminale S • Niveau avancé</p>

    <nav>
        <a href="index.html">🏠 Accueil</a>
        <a href="cours.html">📚 Cours</a>
        <a href="quiz.html">🧠 Tous les quiz</a>
    </nav>

</header>


<main>

<section class="quiz-box">

    <h2 id="titre">Question 1 / 10</h2>

    <div id="quiz"></div>

    <button id="suivant" onclick="suivante()">
        Question suivante →
    </button>

    <div id="resultat"></div>

</section>

</main>


<footer>

    <p>© 2026 Maths Terminale S</p>

    <p>Apprendre les maths autrement 🚀</p>

</footer>


<script>

const questions = [

{
    question: "Quelle est la dérivée de f(x) = x³ ?",

    reponses: [
        "x²",
        "3x²",
        "3x",
        "x⁴"
    ],

    correcte: 1
},

{
    question: "Quelle est la dérivée de f(x) = 5x² - 3x + 7 ?",

    reponses: [
        "10x - 3",
        "5x - 3",
        "10x + 7",
        "5x² - 3"
    ],

    correcte: 0
},

{
    question: "La dérivée de eˣ est :",

    reponses: [
        "xeˣ",
        "eˣ",
        "1/eˣ",
        "x"
    ],

    correcte: 1
},

{
    question: "La dérivée de ln(x), pour x > 0, est :",

    reponses: [
        "ln(x)",
        "x",
        "1/x",
        "eˣ"
    ],

    correcte: 2
},

{
    question: "Soit f(x) = x² - 4x + 3. Pour quelle valeur de x a-t-on f'(x) = 0 ?",

    reponses: [
        "x = 1",
        "x = 2",
        "x = 3",
        "x = 4"
    ],

    correcte: 1
},

{
    question: "Si f'(x) > 0 sur un intervalle, alors f est :",

    reponses: [
        "décroissante",
        "constante",
        "croissante",
        "nulle"
    ],

    correcte: 2
},

{
    question: "Soit f(x) = (2x + 1)eˣ. Sa dérivée est :",

    reponses: [
        "(2x + 1)eˣ",
        "(2x + 3)eˣ",
        "2eˣ",
        "(2x - 1)eˣ"
    ],

    correcte: 1
},

{
    question: "Soit f(x) = ln(x) - x. Alors f'(x) est :",

    reponses: [
        "1/x - 1",
        "1/x + 1",
        "ln(x) - 1",
        "x - 1/x"
    ],

    correcte: 0
},

{
    question: "Si f'(x) change de signe de + vers − en x = a, alors f possède en a :",

    reponses: [
        "un minimum",
        "un maximum",
        "un point d'inflexion obligatoire",
        "aucun extremum"
    ],

    correcte: 1
},

{
    question: "Soit f(x) = x³ - 3x² + 2. Les solutions de f'(x) = 0 sont :",

    reponses: [
        "x = 0 et x = 2",
        "x = -1 et x = 1",
        "x = 1 et x = 2",
        "x = 0 et x = 3"
    ],

    correcte: 0
}

];


questions.sort(() => Math.random() - 0.5);

let numero = 0;
let score = 0;
let repondu = false;


function afficher() {

    repondu = false;

    const q = questions[numero];

    document.getElementById("titre").textContent =
        "Question " + (numero + 1) +
        " / " + questions.length;

    let contenu =
        "<h3>" + q.question + "</h3>";

    for (let i = 0; i < q.reponses.length; i++) {

        contenu +=
        '<button class="reponse" onclick="verifier(' +
        i + ')">' +
        q.reponses[i] +
        '</button>';

    }

    document.getElementById("quiz").innerHTML =
        contenu;

    document.getElementById("resultat").innerHTML =
        "";

}


function verifier(index) {

    if (repondu) return;

    repondu = true;

    const q = questions[numero];

    const boutons =
        document.querySelectorAll(".reponse");

    if (index === q.correcte) {

        score++;

        boutons[index].classList.add("bonne");

        document.getElementById("resultat").innerHTML =
            "✅ Bonne réponse !";

    } else {

        boutons[index].classList.add("mauvaise");

        boutons[q.correcte].classList.add("bonne");

        document.getElementById("resultat").innerHTML =
            "❌ Mauvaise réponse.";

    }

}


function suivante() {

    if (!repondu) {

        alert("Choisis une réponse avant de continuer.");

        return;

    }

    numero++;

    if (numero < questions.length) {

        afficher();

    } else {

        finQuiz();

    }

}


function finQuiz() {

    document.getElementById("quiz").innerHTML =
        "";

    document.getElementById("titre").textContent =
        "🎉 Quiz terminé";

    document.getElementById("suivant").style.display =
        "none";

    let message;

    if (score >= 9) {

        message =
            "🏆 Excellent ! Tu maîtrises parfaitement la dérivation.";

    } else if (score >= 7) {

        message =
            "👏 Très bon niveau !";

    } else if (score >= 5) {

        message =
            "👍 Bon début. Continue à t'entraîner.";

    } else {

        message =
            "📚 Reprends le cours et réessaie.";

    }

    document.getElementById("resultat").innerHTML =

        "<h2>Score : " +
        score + " / " +
        questions.length +
        "</h2>" +

        "<p>" + message + "</p>" +

        '<button onclick="location.reload()">' +
        "🔄 Recommencer" +
        "</button>";

}


afficher();

</script>

</body>

</html>
